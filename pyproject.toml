[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "open-dmrv"
version = "0.1.0"
description = "Research implementation of an open digital MRV model aligned with VM0042 Quantification Approach 1"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Daniel Mulat", email = "danielg.mulat@gmail.com"}]
keywords = ["MRV", "VM0042", "soil organic carbon", "RothC", "livestock methane", "Ethiopia"]
dependencies = ["numpy>=1.26", "pandas>=2.1", "pydantic>=2.6", "PyYAML>=6.0", "typer>=0.12", "openpyxl>=3.1", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]
app = ["streamlit>=1.36"]

[project.scripts]
open-dmrv = "open_dmrv.cli:app"

[project.urls]
Documentation = "https://github.com/danmulat/open_dmrv_vm0042"
Source = "https://github.com/danmulat/open_dmrv_vm0042"

[tool.hatch.build.targets.wheel]
packages = ["src/open_dmrv"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
